services:
  - type: web
    name: clinic-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://clinic-web.vercel.app
